# Zipkin com armazenamento no Elasticsearch. Os índices têm 1 shard e 0 réplicas, como os do
# Jaeger. TRACES_MEM e ZIPKIN_HEAP vêm do ambiente.env, e o orçamento de memória é o mesmo do
# Jaeger.
services:
  zipkin:
    image: openzipkin/zipkin-slim:${ZIPKIN_VERSION}
    environment:
      - STORAGE_TYPE=elasticsearch
      - ES_HOSTS=http://elasticsearch:9200
      - ES_INDEX_SHARDS=1
      - ES_INDEX_REPLICAS=0
      - JAVA_OPTS=-Xms${ZIPKIN_HEAP:-768m} -Xmx${ZIPKIN_HEAP:-768m}
    mem_limit: ${TRACES_MEM:-1g}
    ports: ["9411:9411"]

networks:
  default:
    name: tcc
    external: true