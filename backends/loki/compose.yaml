# Loki em modo monolítico, com dados no volume loki-data e a configuração de loki.yaml.
# BACKEND_MEM vem do ambiente.env, e o valor depois de :- é o padrão local.
services:
  loki:
    image: grafana/loki:${LOKI_VERSION}
    command: ["-config.file=/etc/loki/loki.yaml"]
    mem_limit: ${BACKEND_MEM:-3g}
    ports: ["3100:3100"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

volumes:
  loki-data:
    name: loki-data

networks:
  default:
    name: tcc
    external: true