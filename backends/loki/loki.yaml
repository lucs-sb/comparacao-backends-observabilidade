# Configuração do Loki para o experimento.
#
# Os limites de taxa e de tamanho de mensagem foram elevados a valores que nunca são
# atingidos. Os padrões do Loki são cotas de proteção, como 4 MB/s por tenant e mensagens
# internas de 4 MB, e com eles o experimento mediria a cota, e não a capacidade da
# ferramenta. Os tempos limite longos permitem contar os dados depois de uma saturação, e o
# cache de resultados fica desligado para que cada consulta repetida seja de fato executada.
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_server_max_recv_msg_size: 67108864   # 64 MB, para os lotes grandes do Collector
  grpc_server_max_send_msg_size: 67108864
  http_server_read_timeout: 10m
  http_server_write_timeout: 10m
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  allow_structured_metadata: true
  ingestion_rate_mb: 10240          # cota por tenant elevada para não limitar a vazão
  ingestion_burst_size_mb: 20480
  per_stream_rate_limit: 10GB
  per_stream_rate_limit_burst: 20GB
  query_timeout: 10m
query_range:
  cache_results: false              # cada repetição do experimento de consulta é executada
ingester_client:                    # mensagens internas entre distribuidor e ingester
  grpc_client_config:
    max_recv_msg_size: 67108864
    max_send_msg_size: 67108864