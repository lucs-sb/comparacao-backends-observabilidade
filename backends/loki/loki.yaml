auth_enabled: false
server:
  http_listen_port: 3100
  grpc_server_max_recv_msg_size: 67108864
  grpc_server_max_send_msg_size: 67108864
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  allow_structured_metadata: true
  ingestion_rate_mb: 10240
  ingestion_burst_size_mb: 20480
  per_stream_rate_limit: 10GB
  per_stream_rate_limit_burst: 20GB
query_range:
  cache_results: false
ingester_client:
  grpc_client_config:
    max_recv_msg_size: 67108864
    max_send_msg_size: 67108864