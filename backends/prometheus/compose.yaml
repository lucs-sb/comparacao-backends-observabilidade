# Prometheus recebendo amostras por escrita remota (remote write), sem coletar alvos.
# BACKEND_MEM vem do ambiente.env, e o valor depois de :- é o padrão local.
services:
  prometheus:
    image: prom/prometheus:${PROM_VERSION}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    mem_limit: ${BACKEND_MEM:-3g}
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus

volumes:
  prom-data:
    name: prom-data

networks:
  default:
    name: tcc
    external: true