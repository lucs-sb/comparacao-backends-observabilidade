# VictoriaMetrics em nó único, recebendo amostras por escrita remota no mesmo caminho do
# Prometheus. O cache de consultas fica desligado, como o do Loki.
# BACKEND_MEM vem do ambiente.env, e o valor depois de :- é o padrão local.
services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:${VM_VERSION}
    command: ["-storageDataPath=/storage", "-search.disableCache"]
    mem_limit: ${BACKEND_MEM:-3g}
    ports: ["8428:8428"]
    volumes: ["vm-data:/storage"]

volumes:
  vm-data:
    name: vm-data

networks:
  default:
    name: tcc
    external: true