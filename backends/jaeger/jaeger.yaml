# Configuração do Jaeger 2, que é montado sobre o OpenTelemetry Collector: recebe OTLP e
# grava no Elasticsearch, com a interface de consulta na porta 16686.
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

extensions:
  healthcheckv2:
    use_v2: true
    http:
  jaeger_query:
    storage:
      traces: es_main
    http:
      endpoint: 0.0.0.0:16686
  jaeger_storage:
    backends:
      es_main:
        elasticsearch:
          server_urls: [http://elasticsearch:9200]
          bulk_processing:
            # O padrão é um worker de gravação em lote, que limitava o Jaeger a um núcleo do
            # Elasticsearch. Dez é o mesmo paralelismo de envio que o Collector usa nos pares
            # que gravam no Elasticsearch.
            workers: 10
          indices:                     # 1 shard e 0 réplicas, os mesmos valores do Zipkin e dos logs
            index_prefix: jaeger-main
            spans: {shards: 1, replicas: 0}
            services: {shards: 1, replicas: 0}
            dependencies: {shards: 1, replicas: 0}
            sampling: {shards: 1, replicas: 0}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: es_main