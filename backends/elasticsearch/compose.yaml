services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1536m -Xmx1536m
    mem_limit: 3g
    ports: ["9200:9200"]
    volumes: ["es-data:/usr/share/elasticsearch/data"]

volumes:
  es-data:
    name: es-data

networks:
  default:
    name: tcc
    external: true