# Experimento de consulta, par de logs com o Loki: lê os arquivos fixos de logs gerados pelo
# flog. O nome de cada arquivo vira o service.name do recurso, que o Loki transforma no
# rótulo service_name. Assim, os 100 arquivos são 100 serviços, cada um com 1% dos logs.
receivers:
  filelog:
    include: [/var/log/flog/*.log]
    start_at: beginning
    include_file_name: true
    operators:
      - type: regex_parser
        parse_from: attributes["log.file.name"]
        regex: '^(?P<servico>.+)\.log$'
      - type: move
        from: attributes.servico
        to: resource["service.name"]
exporters:
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
