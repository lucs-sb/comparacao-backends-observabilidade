# Parte comum do Collector isolado: recebe OTLP, limita a memória a 85% do contêiner, agrupa
# os itens em lotes e expõe as métricas internas detalhadas na porta 8888, sem enviá-las a
# backend algum. Os arquivos de cada par acrescentam o exportador e o pipeline.
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 85
  batch: {}
service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus: {host: 0.0.0.0, port: 8888}