# Ajustes no Collector e no gerador de carga da Demo, carregados depois dos arquivos da Demo.
services:
  otel-collector:
    deploy:
      resources:
        limits:
          memory: ${COLLECTOR_MEM:-1G}   # 1G no MacBook, 8G na AWS
    ports:
      - "8888:8888"                     # métricas internas, lidas pelo orquestrador
    networks:
      - default
      - tcc                             # alcança os backends pelo nome

  load-generator:
    deploy:
      resources:
        limits:
          memory: 4G                    # 1500M na Demo; com 50 usuários já chegava a 1,4 GiB

networks:
  tcc:
    external: true
